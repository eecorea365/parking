<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차량 이동 요청</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:420px;
    background:#1c1c1c;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 25px rgba(255,255,255,.08);
}

.logo{
    font-size:42px;
    margin-bottom:15px;
}

.title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#bbbbbb;
    margin-bottom:35px;
}

.button{
    display:block;
    text-decoration:none;
    color:white;
    background:#3b82f6;
    padding:18px;
    margin:15px 0;
    border-radius:14px;
    font-size:22px;
    transition:.2s;
}

.button:hover{
    transform:scale(1.03);
}

.info{
    margin-top:35px;
    color:#888;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">🚗</div>

<div class="title">
Tesla Model Y
</div>

<div class="subtitle">
차량 이동이 필요하신가요?
</div>

<a class="button" href="tel:01072607368">
📞 전화하기
</a>

<a class="button" href="sms:01072607368">
💬 문자 보내기
</a>

<div class="info">
급한 경우 전화 부탁드립니다.
</div>

</div>

</body>
</html>
