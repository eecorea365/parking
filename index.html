<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Model Y</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(180deg,#111,#000);
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.container{

    width:92%;
    max-width:430px;

    background:#1a1a1a;

    border:1px solid #333;

    border-radius:28px;

    padding:35px;

    box-shadow:0 15px 45px rgba(0,0,0,.6);

}

.logo{

    font-size:52px;

    text-align:center;

    margin-bottom:10px;

}

.title{

    text-align:center;

    font-size:30px;

    font-weight:bold;

    letter-spacing:2px;

}

.car{

    text-align:center;

    color:#9aa0a6;

    margin-top:8px;

    margin-bottom:35px;

    font-size:18px;

}

.notice{

    background:#222;

    border-left:4px solid #3b82f6;

    border-radius:10px;

    padding:16px;

    color:#ddd;

    line-height:1.6;

    margin-bottom:28px;

}

.btn{

    display:block;

    text-decoration:none;

    color:white;

    text-align:center;

    padding:18px;

    border-radius:15px;

    font-size:22px;

    margin-top:18px;

    transition:.25s;

}

.call{

    background:#2563eb;

}

.sms{

    background:#16a34a;

}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 25px rgba(255,255,255,.12);

}

.footer{

    margin-top:35px;

    text-align:center;

    color:#777;

    font-size:14px;

    line-height:1.7;

}

.version{

    margin-top:25px;

    text-align:center;

    color:#555;

    font-size:12px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🚗
</div>

<div class="title">
TESLA
</div>

<div class="car">
MODEL Y
</div>

<div class="notice">

차량 이동이 필요하신가요?<br><br>

급한 경우에는 <b>전화</b>를,<br>

급하지 않다면 <b>문자</b>를 부탁드립니다.

</div>

<a class="btn call"
href="tel:01072607368">

📞 전화하기

</a>

<a class="btn sms"
href="sms:01072607368">

💬 문자 보내기

</a>

<div class="footer">

🔋 충전 중일 수 있습니다.<br>

확인 후 최대한 빠르게 이동하겠습니다.

</div>

<div class="version">

Tesla Parking Contact v2.0

</div>

</div>

</body>
</html>
