<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla QR Parking</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png" type="image/png">
</head>

<body>

<div class="container">

    <div class="logo">
        🚗
    </div>

    <div class="title">
        TESLA
    </div>

    <div class="subtitle">
        MODEL Y
    </div>

    <div class="status" id="statusCard">

    </div>

    <a
        id="callButton"
        class="button call"
        href="#">

        📞 전화하기

    </a>

    <a
        id="smsButton"
        class="button sms"
        href="#">

        💬 문자 보내기

    </a>

    <div class="status-control">

        <h3>현재 상태 변경</h3>

        <div class="status-buttons">

            <button onclick="changeStatus('available')">
                🟢 대기
            </button>

            <button onclick="changeStatus('charging')">
                🔋 충전
            </button>

            <button onclick="changeStatus('shopping')">
                🛒 쇼핑
            </button>

            <button onclick="changeStatus('meal')">
                🍽️ 식사
            </button>

            <button onclick="changeStatus('driving')">
                🚗 운전
            </button>

        </div>

    </div>

    <div class="qr-section">

        <h3>📱 Model Y Life QR</h3>

        <div id="qrcode"></div>

    </div>


    <div class="footer">

        ⚡ 충전 중일 수 있습니다.<br>
        확인 후 최대한 빠르게 이동하겠습니다.

        <div id="app-version"></div>

        <button id="install-button" hidden>
            📲 앱 설치
        </button>

    </div>

</div>

<script src="js/config.js"></script>

<script src="js/qrcode.min.js"></script>

<script src="js/script.js"></script>

</body>

</html>
