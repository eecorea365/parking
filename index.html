<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla QR Parking</title>
<script>
    window.BUILD_INFO = {
        commit: "{{ site.github.build_revision | slice: 0, 7 }}"
    };
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png" type="image/png">
</head>

<body>

<div class="container">
    <div class="logo">
        <img src="icons/tesla-logo.png" alt="Tesla Logo" class="tesla-logo">
    </div>
    
    <div class="title">
        TESLA
    </div>

    <div class="subtitle">
        MODEL Y
    </div>

    <div class="status" id="statusCard"></div>

    <div class="last-update" id="lastUpdate"></div>

    <a
        id="callButton"
        class="button call"
        href="#">

        <i data-icon="phone"></i><span>전화하기</span>

    </a>

    <a
        id="smsButton"
        class="button sms"
        href="#">

        <i data-icon="message-circle"></i><span>문자 보내기</span>

    </a>

    <div class="footer">
        차량 확인이 필요한 경우 연락 부탁드립니다.<br>
        확인 후 최대한 빠르게 이동하겠습니다.
    </div>

</div>

<script src="js/config.js"></script>

<script src="js/qrcode.min.js"></script>
<script src="js/icons.js"></script>

<script type="module" src="js/script.js"></script>

</body>

</html>
