<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla Parking Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top,#3b3b3b 0%,#111 45%,#000 100%);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    color:white;
}

.card{

    width:92%;

    max-width:430px;

    padding:35px;

    border-radius:30px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 20px 50px rgba(0,0,0,.45);

}

.logo{

    text-align:center;

    font-size:48px;

}

.title{

    text-align:center;

    font-size:32px;

    font-weight:bold;

    letter-spacing:3px;

    margin-top:10px;

}

.subtitle{

    text-align:center;

    color:#bdbdbd;

    margin-top:6px;

    margin-bottom:28px;

}

.status{

    background:rgba(255,255,255,.06);

    border-radius:15px;

    padding:18px;

    margin-bottom:28px;

    line-height:1.8;

}

.status span{

    color:#63d471;

    font-weight:bold;

}

.button{

    display:block;

    text-decoration:none;

    text-align:center;

    color:white;

    padding:18px;

    border-radius:15px;

    margin-top:16px;

    font-size:21px;

    transition:.25s;

}

.button:hover{

    transform:translateY(-3px);

}

.call{

    background:#2563eb;

}

.sms{

    background:#16a34a;

}

.footer{

    margin-top:30px;

    text-align:center;

    color:#888;

    font-size:14px;

    line-height:1.7;

}

.version{

    margin-top:18px;

    text-align:center;

    color:#666;

    font-size:12px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🚗
</div>

<div class="title">
TESLA
</div>

<div class="subtitle">
MODEL Y
</div>

<div class="status">

🟢 <span>차량 확인 가능</span><br>

평균 응답시간 : 약 5분<br>

급한 경우 전화 부탁드립니다.

</div>

<a class="button call"
href="tel:01072607368">

📞 전화하기

</a>

<a class="button sms"
href="sms:01072607368?body=안녕하세요.%0A차량 이동 부탁드립니다.">

💬 문자 보내기

</a>

<div class="footer">

⚡ 충전 중일 수 있습니다.<br>

확인 후 최대한 빠르게 이동하겠습니다.

</div>

<div class="version">

Tesla QR Parking v3.0

</div>

</div>

</body>

</html>
